    <script>
      (function () {
        const READ_ME = "./README.md";
        const target = document.querySelector("#aboutBody");
        const status = document.querySelector("#contentStatus");

        function escapeHtml(value) {
          return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
        }

        function inline(text) {
          let html = escapeHtml(text);
          html = html.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1" loading="lazy" />');
          html = html.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, label, href) {
            const external = /^(https?:)?\/\//i.test(href);
            return `<a href="${href}"${external ? ' target="_blank" rel="noopener"' : ""}>${label}</a>`;
          });
          html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
          html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
          html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");
          return html;
        }

        // README 里大量使用原生 HTML（徽章、居中块、GitHub Stats），按标签深度整块透传
        const CONTAINER = /<(\/?)(div|p|table|section|ul|ol|h1)\b/g;
        function tagDepth(line) {
          let depth = 0;
          let match;
          CONTAINER.lastIndex = 0;
          while ((match = CONTAINER.exec(line))) {
            depth += match[1] ? -1 : 1;
          }
          return depth;
        }

        function renderMarkdown(markdown) {
          const lines = markdown.replace(/\r\n/g, "\n").split("\n");
          const output = [];
          let index = 0;

          while (index < lines.length) {
            const trimmed = lines[index].trim();

            if (!trimmed) {
              index += 1;
              continue;
            }

            if (trimmed.startsWith("<")) {
              const raw = [];
              let depth = 0;
              while (index < lines.length) {
                const line = lines[index];
                if (!line.trim() && depth <= 0) break;
                raw.push(line);
                depth += tagDepth(line);
                index += 1;
                if (depth <= 0) break;
              }
              output.push(raw.join("\n"));
              continue;
            }

            if (/^-{3,}$/.test(trimmed)) {
              output.push("<hr />");
              index += 1;
              continue;
            }

            if (trimmed.startsWith("|")) {
              const rows = [];
              while (index < lines.length && lines[index].trim().startsWith("|")) {
                rows.push(lines[index].trim());
                index += 1;
              }
              if (rows.length >= 2 && /^\|[\s:|-]+\|?$/.test(rows[1])) {
                const parse = (row) =>
                  row.replace(/^\||\|$/g, "").split("|").map((cell) => cell.trim());
                const head = parse(rows[0]);
                const body = rows.slice(2).map(parse);
                output.push(
                  `<table><thead><tr>${head.map((cell) => `<th>${inline(cell)}</th>`).join("")}</tr></thead>` +
                    `<tbody>${body
                      .map((row) => `<tr>${row.map((cell) => `<td>${inline(cell)}</td>`).join("")}</tr>`)
                      .join("")}</tbody></table>`
                );
                continue;
              }
            }

            const heading = trimmed.match(/^(#{1,6})\s+(.+)$/);
            if (heading) {
              const level = Math.min(4, Math.max(2, heading[1].length));
              output.push(`<h${level}>${inline(heading[2])}</h${level}>`);
              index += 1;
              continue;
            }

            if (/^[-*]\s+/.test(trimmed)) {
              const items = [];
              while (index < lines.length && /^[-*]\s+/.test(lines[index].trim())) {
                items.push(lines[index].trim().replace(/^[-*]\s+/, ""));
                index += 1;
              }
              output.push(`<ul>${items.map((item) => `<li>${inline(item)}</li>`).join("")}</ul>`);
              continue;
            }

            const paragraph = [];
            while (
              index < lines.length &&
              lines[index].trim() &&
              !lines[index].trim().startsWith("<") &&
              !lines[index].trim().startsWith("|") &&
              !/^(#{1,6})\s+/.test(lines[index].trim()) &&
              !/^[-*]\s+/.test(lines[index].trim()) &&
              !/^-{3,}$/.test(lines[index].trim())
            ) {
              paragraph.push(lines[index].trim());
              index += 1;
            }
            output.push(`<p>${inline(paragraph.join(" "))}</p>`);
          }

          return output.join("\n");
        }

        fetch(READ_ME, { cache: "no-cache" })
          .then((response) => {
            if (!response.ok) throw new Error("HTTP " + response.status);
            return response.text();
          })
          .then((markdown) => {
            target.innerHTML = renderMarkdown(markdown);
          })
          .catch((error) => {
            console.error(error);
            status.hidden = false;
            status.dataset.variant = "error";
            status.textContent =
              "README 加载失败。请通过本地静态服务器或 GitHub Pages 打开页面，而不是直接双击 file://。";
          });
      })();
    </script>
  </body>
