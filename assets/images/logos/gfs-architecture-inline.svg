<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" width="960" height="452" role="img" aria-label="Mini GFS 架构：客户端向 Master 申请元数据，拿到块与副本位置后直接与 ChunkServer 读写数据">
  <rect width="960" height="452" fill="#F6F2E9"/>

  <g font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif">
    <text x="36" y="54" font-size="14" font-weight="700" fill="#241E14">Mini GFS · 元数据与数据分离</text>
    <g transform="translate(878 24) scale(0.17)">
      <path fill="#00ACD7" d="M40.2,101.1c-0.4,0-0.5-0.2-0.3-0.5l2.1-2.7c0.2-0.3,0.7-0.5,1.1-0.5l35.7,0c0.4,0,0.5,0.3,0.3,0.6l-1.7,2.6c-0.2,0.3-0.7,0.6-1,0.6L40.2,101.1z"/>
      <path fill="#00ACD7" d="M25.1,110.3c-0.4,0-0.5-0.2-0.3-0.5l2.1-2.7c0.2-0.3,0.7-0.5,1.1-0.5l45.6,0c0.4,0,0.6,0.3,0.5,0.6l-0.8,2.4c-0.1,0.4-0.5,0.6-0.9,0.6L25.1,110.3z"/>
      <path fill="#00ACD7" d="M49.3,119.5c-0.4,0-0.5-0.3-0.3-0.6l1.4-2.5c0.2-0.3,0.6-0.6,1-0.6l20,0c0.4,0,0.6,0.3,0.6,0.7l-0.2,2.4c0,0.4-0.4,0.7-0.7,0.7L49.3,119.5z"/>
      <path fill="#00ACD7" d="M153.1,99.3c-6.3,1.6-10.6,2.8-16.8,4.4c-1.5,0.4-1.6,0.5-2.9-1c-1.5-1.7-2.6-2.8-4.7-3.8c-6.3-3.1-12.4-2.2-18.1,1.5c-6.8,4.4-10.3,10.9-10.2,19c0.1,8,5.6,14.6,13.5,15.7c6.8,0.9,12.5-1.5,17-6.6c0.9-1.1,1.7-2.3,2.7-3.7c-3.6,0-8.1,0-19.3,0c-2.1,0-2.6-1.3-1.9-3c1.3-3.1,3.7-8.3,5.1-10.9c0.3-0.6,1-1.6,2.5-1.6c5.1,0,23.9,0,36.4,0c-0.2,2.7-0.2,5.4-0.6,8.1c-1.1,7.2-3.8,13.8-8.2,19.6c-7.2,9.5-16.6,15.4-28.5,17c-9.8,1.3-18.9-0.6-26.9-6.6c-7.4-5.6-11.6-13-12.7-22.2c-1.3-10.9,1.9-20.7,8.5-29.3c7.1-9.3,16.5-15.2,28-17.3c9.4-1.7,18.4-0.6,26.5,4.9c5.3,3.5,9.1,8.3,11.6,14.1C154.7,98.5,154.3,99,153.1,99.3z"/>
      <path fill="#00ACD7" d="M186.2,154.6c-9.1-0.2-17.4-2.8-24.4-8.8c-5.9-5.1-9.6-11.6-10.8-19.3c-1.8-11.3,1.3-21.3,8.1-30.2c7.3-9.6,16.1-14.6,28-16.7c10.2-1.8,19.8-0.8,28.5,5.1c7.9,5.4,12.8,12.7,14.1,22.3c1.7,13.5-2.2,24.5-11.5,33.9c-6.6,6.7-14.7,10.9-24,12.8C191.5,154.2,188.8,154.3,186.2,154.6z M210,114.2c-0.1-1.3-0.1-2.3-0.3-3.3c-1.8-9.9-10.9-15.5-20.4-13.3c-9.3,2.1-15.3,8-17.5,17.4c-1.8,7.8,2,15.7,9.2,18.9c5.5,2.4,11,2.1,16.3-0.6C205.2,129.2,209.5,122.8,210,114.2z"/>
    </g>

    <!-- Client -->
    <rect x="36" y="88" width="200" height="272" fill="#FFFDF8" stroke="#E5DECF" stroke-width="1"/>
    <rect x="36" y="88" width="200" height="40" fill="#241E14"/>
    <text x="56" y="114" font-size="15" font-weight="700" fill="#F6F2E9">Client</text>
    <text x="56" y="158" font-size="13" fill="#7C7361">put / get / ls</text>
    <text x="56" y="182" font-size="13" fill="#7C7361">按 chunkSize 切块</text>
    <text x="56" y="206" font-size="13" fill="#7C7361">每块写满全部副本</text>
    <text x="56" y="230" font-size="13" fill="#7C7361">全部成功后再 commit</text>
    <rect x="56" y="250" width="160" height="1" fill="#E5DECF"/>
    <text x="56" y="280" font-size="13" fill="#7C7361">读时按顺序拼接</text>
    <text x="56" y="304" font-size="13" fill="#7C7361">长度不符换下一个副本</text>
    <text x="56" y="336" font-size="12" font-weight="600" fill="#E0A93C">数据不经过 Master</text>

    <!-- 1. 申请分配 -->
    <path d="M240 140 h96" stroke="#7C7361" stroke-width="1" fill="none"/>
    <path d="M328 134 l10 6 -10 6" stroke="#7C7361" stroke-width="1" fill="none"/>
    <text x="288" y="130" font-size="11" text-anchor="middle" fill="#7C7361">① allocate</text>

    <!-- 2. 返回位置 -->
    <path d="M336 196 h-88" stroke="#7C7361" stroke-width="1" fill="none"/>
    <path d="M256 190 l-10 6 10 6" stroke="#7C7361" stroke-width="1" fill="none"/>
    <text x="288" y="186" font-size="11" text-anchor="middle" fill="#7C7361">② 块与副本位置</text>

    <!-- Master -->
    <rect x="340" y="88" width="240" height="272" fill="#FFFDF8" stroke="#E5DECF" stroke-width="1"/>
    <rect x="340" y="88" width="240" height="40" fill="#E0A93C"/>
    <text x="360" y="114" font-size="15" font-weight="700" fill="#241E14">Master · 控制平面</text>
    <text x="360" y="158" font-size="13" fill="#7C7361">只存元数据，不碰数据</text>
    <text x="360" y="182" font-size="13" fill="#7C7361">files / pending 两张 map</text>
    <rect x="360" y="202" width="200" height="1" fill="#E5DECF"/>
    <text x="360" y="232" font-size="13" fill="#7C7361">POST /allocate</text>
    <text x="360" y="256" font-size="13" fill="#7C7361">POST /commit</text>
    <text x="360" y="280" font-size="13" fill="#7C7361">GET /file · GET /files</text>
    <text x="360" y="312" font-size="12" fill="#7C7361">sync.RWMutex 保护两张 map</text>
    <text x="360" y="336" font-size="12" font-weight="600" fill="#E0A93C">commit 之后才对读者可见</text>

    <!-- ChunkServer -->
    <rect x="676" y="88" width="248" height="272" fill="#FFFDF8" stroke="#E5DECF" stroke-width="1"/>
    <rect x="676" y="88" width="248" height="40" fill="#5FA04E"/>
    <text x="696" y="114" font-size="15" font-weight="700" fill="#F6F2E9">ChunkServer · 数据平面</text>
    <g>
      <rect x="696" y="148" width="208" height="60" fill="#F6F2E9" stroke="#E5DECF" stroke-width="1"/>
      <text x="712" y="174" font-size="13" font-weight="700" fill="#241E14">ChunkServer 1</text>
      <text x="712" y="194" font-size="12" fill="#7C7361">data/chunk1 · 每块一个文件</text>
      <rect x="696" y="218" width="208" height="60" fill="#F6F2E9" stroke="#E5DECF" stroke-width="1"/>
      <text x="712" y="244" font-size="13" font-weight="700" fill="#241E14">ChunkServer 2</text>
      <text x="712" y="264" font-size="12" fill="#7C7361">data/chunk2 · 每块一个文件</text>
      <rect x="696" y="288" width="208" height="56" fill="#FFFDF8" stroke="#E5DECF" stroke-width="1" stroke-dasharray="4 3"/>
      <text x="712" y="312" font-size="13" font-weight="700" fill="#7C7361">ChunkServer N</text>
      <text x="712" y="330" font-size="12" fill="#7C7361">水平扩展，只增容量</text>
    </g>

    <!-- 3. 数据读写 -->
    <path d="M136 360 V412 H800 V362" stroke="#E0A93C" stroke-width="1" fill="none"/>
    <path d="M794 372 l6 -10 6 10" stroke="#E0A93C" stroke-width="1" fill="none"/>
    <text x="200" y="404" font-size="11" fill="#7C7361">③ PUT / GET 整块数据，Master 不转发</text>
  </g>
</svg>
