<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" width="960" height="452" role="img" aria-label="Mini MapReduce 架构：Coordinator 通过 TCP RPC 分发任务，Worker 执行 map 与 reduce，中间数据经共享文件系统交换">
  <rect width="960" height="452" fill="#F6F2E9"/>

  <g font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif">
    <text x="36" y="54" font-size="14" font-weight="700" fill="#241E14">Mini MapReduce · 调度与数据分离</text>
    <g transform="translate(878 24) scale(0.17)">
      <path fill="#00ACD7" d="M40.2,101.1c-0.4,0-0.5-0.2-0.3-0.5l2.1-2.7c0.2-0.3,0.7-0.5,1.1-0.5l35.7,0c0.4,0,0.5,0.3,0.3,0.6l-1.7,2.6c-0.2,0.3-0.7,0.6-1,0.6L40.2,101.1z"/>
      <path fill="#00ACD7" d="M25.1,110.3c-0.4,0-0.5-0.2-0.3-0.5l2.1-2.7c0.2-0.3,0.7-0.5,1.1-0.5l45.6,0c0.4,0,0.6,0.3,0.5,0.6l-0.8,2.4c-0.1,0.4-0.5,0.6-0.9,0.6L25.1,110.3z"/>
      <path fill="#00ACD7" d="M49.3,119.5c-0.4,0-0.5-0.3-0.3-0.6l1.4-2.5c0.2-0.3,0.6-0.6,1-0.6l20,0c0.4,0,0.6,0.3,0.6,0.7l-0.2,2.4c0,0.4-0.4,0.7-0.7,0.7L49.3,119.5z"/>
      <path fill="#00ACD7" d="M153.1,99.3c-6.3,1.6-10.6,2.8-16.8,4.4c-1.5,0.4-1.6,0.5-2.9-1c-1.5-1.7-2.6-2.8-4.7-3.8c-6.3-3.1-12.4-2.2-18.1,1.5c-6.8,4.4-10.3,10.9-10.2,19c0.1,8,5.6,14.6,13.5,15.7c6.8,0.9,12.5-1.5,17-6.6c0.9-1.1,1.7-2.3,2.7-3.7c-3.6,0-8.1,0-19.3,0c-2.1,0-2.6-1.3-1.9-3c1.3-3.1,3.7-8.3,5.1-10.9c0.3-0.6,1-1.6,2.5-1.6c5.1,0,23.9,0,36.4,0c-0.2,2.7-0.2,5.4-0.6,8.1c-1.1,7.2-3.8,13.8-8.2,19.6c-7.2,9.5-16.6,15.4-28.5,17c-9.8,1.3-18.9-0.6-26.9-6.6c-7.4-5.6-11.6-13-12.7-22.2c-1.3-10.9,1.9-20.7,8.5-29.3c7.1-9.3,16.5-15.2,28-17.3c9.4-1.7,18.4-0.6,26.5,4.9c5.3,3.5,9.1,8.3,11.6,14.1C154.7,98.5,154.3,99,153.1,99.3z"/>
      <path fill="#00ACD7" d="M186.2,154.6c-9.1-0.2-17.4-2.8-24.4-8.8c-5.9-5.1-9.6-11.6-10.8-19.3c-1.8-11.3,1.3-21.3,8.1-30.2c7.3-9.6,16.1-14.6,28-16.7c10.2-1.8,19.8-0.8,28.5,5.1c7.9,5.4,12.8,12.7,14.1,22.3c1.7,13.5-2.2,24.5-11.5,33.9c-6.6,6.7-14.7,10.9-24,12.8C191.5,154.2,188.8,154.3,186.2,154.6z M210,114.2c-0.1-1.3-0.1-2.3-0.3-3.3c-1.8-9.9-10.9-15.5-20.4-13.3c-9.3,2.1-15.3,8-17.5,17.4c-1.8,7.8,2,15.7,9.2,18.9c5.5,2.4,11,2.1,16.3-0.6C205.2,129.2,209.5,122.8,210,114.2z"/>
    </g>

    <!-- Worker -->
    <rect x="36" y="88" width="214" height="272" fill="#FFFDF8" stroke="#E5DECF" stroke-width="1"/>
    <rect x="36" y="88" width="214" height="40" fill="#241E14"/>
    <text x="56" y="114" font-size="15" font-weight="700" fill="#F6F2E9">Worker · 被动执行</text>
    <text x="56" y="158" font-size="13" fill="#7C7361">循环拉任务，不保存全局状态</text>
    <rect x="56" y="174" width="174" height="1" fill="#E5DECF"/>
    <text x="56" y="202" font-size="13" fill="#7C7361">map：读输入 → 按分区落盘</text>
    <text x="56" y="226" font-size="13" fill="#7C7361">reduce：读同分区 → 聚合</text>
    <text x="56" y="250" font-size="13" fill="#7C7361">失败：清理本次尝试的输出</text>
    <text x="56" y="274" font-size="13" fill="#7C7361">wait：等 100ms 再来</text>
    <text x="56" y="298" font-size="13" fill="#7C7361">exit：任务全部完成，退出</text>
    <text x="56" y="336" font-size="12" font-weight="600" fill="#E0A93C">数量任意增减，进程可随时消失</text>

    <!-- ① 拉任务 -->
    <path d="M256 146 h58" stroke="#7C7361" stroke-width="1" fill="none"/>
    <path d="M306 140 l10 6 -10 6" stroke="#7C7361" stroke-width="1" fill="none"/>
    <text x="286" y="134" font-size="10" text-anchor="middle" fill="#7C7361">① Request</text>

    <!-- ② 派发 -->
    <path d="M316 200 h-56" stroke="#7C7361" stroke-width="1" fill="none"/>
    <path d="M268 194 l-10 6 10 6" stroke="#7C7361" stroke-width="1" fill="none"/>
    <text x="288" y="190" font-size="10" text-anchor="middle" fill="#7C7361">② 派任务</text>

    <!-- Coordinator -->
    <rect x="330" y="88" width="232" height="272" fill="#FFFDF8" stroke="#E5DECF" stroke-width="1"/>
    <rect x="330" y="88" width="232" height="40" fill="#E0A93C"/>
    <text x="350" y="114" font-size="15" font-weight="700" fill="#241E14">Coordinator · 调度中心</text>
    <text x="350" y="158" font-size="13" fill="#7C7361">c.maps / c.reduces 状态表</text>
    <text x="350" y="182" font-size="13" fill="#7C7361">先 map 后 reduce 的阶段屏障</text>
    <text x="350" y="206" font-size="13" fill="#7C7361">超时 10s 未完成 → 重派</text>
    <text x="350" y="230" font-size="13" fill="#7C7361">验收当前尝试 → rename 发布</text>
    <rect x="350" y="248" width="192" height="1" fill="#E5DECF"/>
    <text x="350" y="276" font-size="12" fill="#7C7361">RequestTask · ReportTask · Done</text>
    <text x="350" y="300" font-size="12" fill="#7C7361">net/rpc over TCP</text>
    <text x="350" y="336" font-size="12" font-weight="600" fill="#E0A93C">c.mu 保护状态，多 worker 并发安全</text>

    <!-- ④ 发布 -->
    <path d="M646 262 h-70" stroke="#E0A93C" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
    <path d="M584 256 l-10 6 10 6" stroke="#E0A93C" stroke-width="1" fill="none"/>
    <text x="612" y="250" font-size="10" text-anchor="middle" fill="#7C7361">④ 发布</text>

    <!-- 共享文件系统 -->
    <rect x="646" y="88" width="278" height="272" fill="#FFFDF8" stroke="#E5DECF" stroke-width="1"/>
    <rect x="646" y="88" width="278" height="40" fill="#5FA04E"/>
    <text x="666" y="114" font-size="15" font-weight="700" fill="#F6F2E9">共享文件系统 · 输出目录</text>
    <text x="666" y="158" font-size="12" fill="#7C7361">map 中间结果</text>
    <text x="666" y="178" font-size="11" fill="#241E14">mr-map-&lt;map&gt;-&lt;attempt&gt;-&lt;n&gt;.json</text>
    <text x="666" y="210" font-size="12" fill="#7C7361">reduce 临时结果</text>
    <text x="666" y="230" font-size="11" fill="#241E14">mr-reduce-&lt;id&gt;-&lt;attempt&gt;.tmp</text>
    <text x="666" y="262" font-size="12" fill="#7C7361">最终结果</text>
    <text x="666" y="282" font-size="11" fill="#241E14">mr-out-&lt;id&gt;</text>
    <rect x="666" y="300" width="238" height="1" fill="#E5DECF"/>
    <text x="666" y="326" font-size="11" fill="#7C7361">先写 .mr-* 临时文件，flush 后 rename</text>
    <text x="666" y="344" font-size="11" font-weight="600" fill="#E0A93C">数据走磁盘，不走网络</text>

    <!-- ③ 落盘 -->
    <path d="M143 360 V410 H785 V362" stroke="#7C7361" stroke-width="1" fill="none"/>
    <path d="M779 372 l6 -10 6 10" stroke="#7C7361" stroke-width="1" fill="none"/>
    <text x="220" y="402" font-size="11" fill="#7C7361">③ map / reduce 都直接读写共享目录，中间数据不经 coordinator 转发</text>
  </g>
</svg>
