<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 344" width="960" height="344" role="img" aria-label="任务状态流转：可分配经 RequestTask 变为执行中，超时或失败回到可分配，上报成功后变为已提交">
  <rect width="960" height="344" fill="#F6F2E9"/>

  <g font-family="PingFang SC, Microsoft YaHei, Segoe UI, sans-serif">
    <text x="36" y="48" font-size="14" font-weight="700" fill="#241E14">任务状态 · 至少一次执行，尝试编号隔离</text>

    <!-- idle -->
    <rect x="60" y="96" width="190" height="96" fill="#FFFDF8" stroke="#E5DECF" stroke-width="1"/>
    <text x="80" y="128" font-size="14" font-weight="700" fill="#241E14">可分配</text>
    <text x="80" y="152" font-size="12" fill="#7C7361">started = 0</text>
    <text x="80" y="172" font-size="12" fill="#7C7361">等待 worker 来领取</text>

    <!-- running -->
    <rect x="360" y="96" width="200" height="96" fill="#FFFDF8" stroke="#E0A93C" stroke-width="2"/>
    <text x="380" y="128" font-size="14" font-weight="700" fill="#241E14">执行中</text>
    <text x="380" y="152" font-size="12" fill="#7C7361">attempt++ · 记 started</text>
    <text x="380" y="172" font-size="12" fill="#7C7361">输出带本次尝试编号</text>

    <!-- done -->
    <rect x="680" y="96" width="200" height="96" fill="#FFFDF8" stroke="#5FA04E" stroke-width="2"/>
    <text x="700" y="128" font-size="14" font-weight="700" fill="#241E14">已提交</text>
    <text x="700" y="152" font-size="12" fill="#7C7361">done = true</text>
    <text x="700" y="172" font-size="12" fill="#7C7361">只认当前尝试的结果</text>

    <!-- ① 派发 -->
    <path d="M254 144 h92" stroke="#7C7361" stroke-width="1" fill="none"/>
    <path d="M338 138 l10 6 -10 6" stroke="#7C7361" stroke-width="1" fill="none"/>
    <text x="300" y="132" font-size="11" text-anchor="middle" fill="#7C7361">① RequestTask</text>
    <text x="300" y="176" font-size="11" text-anchor="middle" fill="#7C7361">派发 map / reduce</text>

    <!-- ② 上报 -->
    <path d="M564 144 h102" stroke="#7C7361" stroke-width="1" fill="none"/>
    <path d="M658 138 l10 6 -10 6" stroke="#7C7361" stroke-width="1" fill="none"/>
    <text x="615" y="132" font-size="11" text-anchor="middle" fill="#7C7361">② ReportTask</text>
    <text x="615" y="176" font-size="11" text-anchor="middle" fill="#7C7361">成功 / 失败</text>

    <!-- 重试回路 -->
    <path d="M460 196 V250 H155 V196" stroke="#E0A93C" stroke-width="1" stroke-dasharray="5 3" fill="none"/>
    <path d="M149 204 l6 -10 6 10" stroke="#E0A93C" stroke-width="1" fill="none"/>
    <text x="470" y="244" font-size="11" fill="#7C7361">超时 10s 未上报，或 worker 报错 → 回到可分配，下一次派发 attempt++</text>

    <rect x="60" y="278" width="820" height="1" fill="#E5DECF"/>
    <text x="60" y="306" font-size="12" fill="#7C7361">迟到的 worker 只能写到自己那次尝试的文件名，无法覆盖新尝试的产物；</text>
    <text x="60" y="326" font-size="12" fill="#7C7361">coordinator 只接收当前尝试的提交，重复上报按幂等处理。</text>
  </g>
</svg>
