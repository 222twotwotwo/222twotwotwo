<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="222twotwotwo 的个人静态博客，记录 Go 后端、微服务、RPC、AI 工程化与开源学习。"
    />
    <title>222twotwotwo | 个人博客</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#blog-title">跳到文章列表</a>

    <header class="site-header">
      <a class="brand" href="https://github.com/222twotwotwo" aria-label="访问 222twotwotwo GitHub 主页">
        <img src="./assets/images/avatar.png" alt="222twotwotwo 头像" />
        <span>222twotwotwo</span>
        <svg class="brand-ext" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 17 17 7M9 7h8v8" />
        </svg>
      </a>
      <nav class="site-nav" aria-label="主导航">
        <a href="./">文章</a>
        <a href="./opensource.html">开源</a>
        <a href="./friends.html">友链</a>
        <a href="#contact">联系</a>
      </nav>
    </header>

    <main>
      <section class="deck-shell" aria-label="博客文章">
        <aside class="desk-panel" aria-label="文章筛选">
          <label for="searchInput">搜索</label>
          <input id="searchInput" type="search" autocomplete="off" />

          <div class="filter-group">
            <span>标签</span>
            <div id="tagFilters" class="tag-filters"></div>
          </div>
        </aside>

        <section class="paper-section" aria-labelledby="blog-title">
          <div class="section-heading">
            <div>
              <h2 id="blog-title">文章</h2>
            </div>
          </div>

          <p id="contentStatus" class="content-status" hidden></p>
          <div id="postList" class="post-list" aria-live="polite"></div>
        </section>
      </section>
    </main>

    <footer id="contact" class="site-footer">
      <div>
        <strong>联系方式</strong>
      </div>
      <div class="footer-links">
        <a href="mailto:3379571673@qq.com">3379571673@qq.com</a>
        <a href="https://github.com/222twotwotwo">GitHub</a>
      </div>
    </footer>

    <script src="./assets/main.js"></script>
  </body>
</html>
